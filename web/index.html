<!doctype html>
<html lang="cs" data-display="standard">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no + touch-action: no double-tap zoom / pinch during fast entry (ch. 4) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>kLog</title>
    <!-- %BASE_URL% resolves to / in dev and /kLog/ in the Pages build -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS: standalone home-screen app (Safari has no beforeinstallprompt, ch. 13) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="kLog" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
