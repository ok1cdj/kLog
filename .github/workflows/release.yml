name: Release

# Build a signed release APK and attach it to a GitHub Release whenever a v* tag
# is pushed (e.g. `git tag v1.0 && git push origin v1.0`). Also runnable manually.
# The web is deployed separately on every push to main (deploy.yml).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - `base64 -w0 keystore/klog.jks`
#   KEYSTORE_PASSWORD  - store password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only when the Android module exists — gate on the file, not a version number.
    if: hashFiles('app/build.gradle.kts') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Only platform-tools; AGP fetches the platform and build-tools it needs.
          packages: platform-tools

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/klog.jks

      - name: Write signing config
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "signing.storeFile=keystore/klog.jks"
            echo "signing.storePassword=${STORE_PW}"
            echo "signing.keyAlias=${KEY_ALIAS}"
            echo "signing.keyPassword=${KEY_PW}"
          } > local.properties

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VER=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          NAME="klog-${VER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
